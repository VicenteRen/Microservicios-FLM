spring.application.name=ventas
server.port=8084

# Conexión a MySQL (Laragon)
spring.datasource.url=jdbc:mysql://localhost:3306/ventas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Creación automática de tablas con JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar Flyway
spring.flyway.enabled=false